rules:
  ruchaka:
    name: रुचक योग
    text: मंगल केंद्र में बलवान है। साहस, ऊर्जा, नेतृत्व और निर्णायक कार्य करने की क्षमता प्रमुख रहती है।
  bhadra:
    name: भद्र योग
    text: बुध केंद्र में बलवान है। बुद्धिमत्ता, वाक्पटुता, व्यापारिक कौशल और विद्या प्रमुख रहती है।
  hamsa:
    name: हंस योग
    text: गुरु केंद्र में बलवान है। ज्ञान, नैतिकता, समाज में सम्मान और मार्गदर्शक स्वभाव प्रमुख रहता है।
  malavya:
    name: मालव्य योग
    text: शुक्र केंद्र में बलवान है। सुख-सुविधा, कलात्मक रुचि, आकर्षण और जीवन के आनंद पर बल रहता है।
  shasha:
    name: शश योग
    text: शनि केंद्र में बलवान है। अनुशासन, धैर्य, संगठन क्षमता और लोगों पर अधिकार प्रमुख रहता है।
  gajakesari:
    name: गजकेसरी योग
    text: गुरु चंद्रमा से केंद्र में है। परंपरागत रूप से यह यश, दृढ़ता और उदार व विवेकपूर्ण दृष्टिकोण से जुड़ा है।
  sunapha:
    name: सुनफा योग
    text: चंद्रमा से दूसरे भाव में ग्रह है। अपने प्रयासों से अर्जित धन और अच्छी प्रतिष्ठा।
  anapha:
    name: अनफा योग
    text: चंद्रमा से बारहवें भाव में ग्रह है। अच्छा स्वास्थ्य, सुखद व्यक्तित्व और संतोष।
  durudhura:
    name: दुरुधरा योग
    text: चंद्रमा के दोनों ओर ग्रह हैं। सहयोग, संसाधन और सुख-सुविधाएँ उपलब्ध रहती हैं।
  kemadruma:
    name: केमद्रुम योग
    text: चंद्रमा के आसपास किसी ग्रह का सहयोग नहीं है। परंपरागत रूप से इसे ऐसे समय से जोड़ा जाता है जब व्यक्ति स्वयं को अकेला महसूस करे; इसके कई भंग-नियम हैं, इसलिए इसे भाग्य नहीं, केवल एक प्रवृत्ति मानें।
  adhi:
    name: अधि योग
    text: तीनों शुभ ग्रह चंद्रमा से छठे, सातवें या आठवें भाव में हैं। नेतृत्व, प्रभाव और सुखी जीवन से जुड़ा योग।
  chandra_mangala:
    name: चंद्र-मंगल योग
    text: चंद्रमा और मंगल साथ हैं। उद्यम और धन कमाने की क्षमता; भावनात्मक तीव्रता को सही दिशा देना आवश्यक है।
  budhaditya:
    name: बुधादित्य योग
    text: सूर्य और बुध साथ हैं। तीव्र बुद्धि और संवाद कौशल; यह योग बहुत सामान्य है क्योंकि बुध सदा सूर्य के निकट रहता है।
  amala:
    name: अमला योग
    text: दसवें भाव में शुभ ग्रह है। अपने कर्म और आचरण से अच्छी प्रतिष्ठा।
  yogakaraka:
    name: योगकारक ग्रह
    text: इस लग्न के लिए एक ही ग्रह केंद्र और त्रिकोण दोनों का स्वामी है, जिससे वह कुंडली का सबसे शुभ कार्यकारी ग्रह बनता है। इसकी दशा प्रायः फलदायी रहती है।
  raja_yoga_kendra_trikona:
    name: राजयोग (केंद्र–त्रिकोण स्वामी)
    text: केंद्र और त्रिकोण के स्वामी युति, परिवर्तन या परस्पर दृष्टि से जुड़े हैं। विशेषकर इन ग्रहों की दशा में पद-प्रतिष्ठा और सफलता में वृद्धि।
  dhana_yoga:
    name: धन योग
    text: धन भावों (दूसरा, ग्यारहवाँ) के स्वामी पहले, पाँचवें या नौवें भाव के स्वामी से जुड़े हैं। विशेषकर संबंधित दशाओं में धन संचय की क्षमता।
  harsha:
    name: हर्ष योग (विपरीत राजयोग)
    text: छठे भाव का स्वामी दुःस्थान (6, 8, 12) में है। कठिनाइयाँ लाभ में बदलती हैं; शत्रुओं और रोगों के विरुद्ध दृढ़ता।
  sarala:
    name: सरल योग (विपरीत राजयोग)
    text: आठवें भाव का स्वामी दुःस्थान (6, 8, 12) में है। निर्भयता और संकटों से और मज़बूत होकर निकलने की क्षमता।
  vimala:
    name: विमल योग (विपरीत राजयोग)
    text: बारहवें भाव का स्वामी दुःस्थान (6, 8, 12) में है। मितव्ययिता, स्वतंत्रता और सदाचार।
  parivartana:
    name: परिवर्तन योग (राशि परिवर्तन)
    text: दो ग्रह एक-दूसरे की राशि में हैं, जिससे दोनों भावों के विषय आपस में गहराई से जुड़ जाते हैं। फल इस पर निर्भर है कि कौन-से भाव शामिल हैं।
  neecha_bhanga:
    name: नीचभंग राजयोग
    text: नीच ग्रह की नीचता भंग हो रही है। उस ग्रह से जुड़े क्षेत्रों में आरंभिक संघर्ष आगे चलकर उल्लेखनीय उपलब्धि में बदल सकता है।
  vargottama:
    name: वर्गोत्तम ग्रह
    text: ग्रह राशि (D1) और नवांश (D9) दोनों में एक ही राशि में है, जिससे वह बलवान होता है और उसके फल अधिक स्थिर रहते हैं।
  manglik_dosha:
    name: मांगलिक (कुज) दोष
    text: मंगल लग्न से पहले, दूसरे, चौथे, सातवें, आठवें या बारहवें भाव में है। विवाह मिलान में परंपरागत रूप से इसका विचार होता है; इसके कई शास्त्रीय परिहार हैं, और मांगलिक कुंडली से मिलान एक सामान्य उपाय
      है।
  kaal_sarp_dosha:
    name: कालसर्प दोष
    text: सभी सात ग्रह राहु–केतु अक्ष के एक ओर हैं। यह बाद की लोकप्रिय (पाराशरी नहीं) अवधारणा है, जिसे असमान प्रगति और अचानक मोड़ों से जोड़ा जाता है। इसे अकेले नहीं, पूरी कुंडली के साथ देखें।
  lagna_lord_h1:
    name: लग्नेश प्रथम भाव में
    text: 'लग्नेश {lagna_lord} प्रथम भाव में है: आत्मनिर्भर, अपने बल पर आगे बढ़ने वाला व्यक्ति, दृढ़ पहचान और अच्छी जीवनशक्ति।'
  lagna_lord_h2:
    name: लग्नेश द्वितीय भाव में
    text: 'लग्नेश {lagna_lord} द्वितीय भाव में है: धन संचय, पारिवारिक मूल्यों और वाणी पर ध्यान; अपने प्रयासों से कमाई।'
  lagna_lord_h3:
    name: लग्नेश तृतीय भाव में
    text: 'लग्नेश {lagna_lord} तृतीय भाव में है: साहस, पहल और संवाद कौशल; भाई-बहन और छोटी यात्राएँ प्रमुख।'
  lagna_lord_h4:
    name: लग्नेश चतुर्थ भाव में
    text: 'लग्नेश {lagna_lord} चतुर्थ भाव में है: घर, माता, संपत्ति और मानसिक शांति से जुड़ा सुख; प्रायः सुविधाएँ और वाहन।'
  lagna_lord_h5:
    name: लग्नेश पंचम भाव में
    text: 'लग्नेश {lagna_lord} पंचम भाव में है: बुद्धिमत्ता, रचनात्मकता और अच्छा विवेक; संतान और पूर्व पुण्य पर बल।'
  lagna_lord_h6:
    name: लग्नेश षष्ठ भाव में
    text: 'लग्नेश {lagna_lord} षष्ठ भाव में है: प्रतिस्पर्धी, सेवा-प्रधान जीवन जो बाधाओं को पार करता है; स्वास्थ्य और ऋण पर ध्यान देना उचित।'
  lagna_lord_h7:
    name: लग्नेश सप्तम भाव में
    text: 'लग्नेश {lagna_lord} सप्तम भाव में है: साझेदारी, जीवनसाथी और जनसंपर्क की ओर उन्मुख जीवन; व्यापार और यात्रा प्रमुख।'
  lagna_lord_h8:
    name: लग्नेश अष्टम भाव में
    text: 'लग्नेश {lagna_lord} अष्टम भाव में है: परिवर्तन, शोध और गूढ़ विषयों में रुचि वाला जीवन; स्वास्थ्य और स्थिरता का ध्यान रखें।'
  lagna_lord_h9:
    name: लग्नेश नवम भाव में
    text: 'लग्नेश {lagna_lord} नवम भाव में है: भाग्यशाली और सिद्धांतवादी; पिता, गुरु और धर्म का सहयोग; उच्च शिक्षा और तीर्थ।'
  lagna_lord_h10:
    name: लग्नेश दशम भाव में
    text: 'लग्नेश {lagna_lord} दशम भाव में है: कर्म-प्रधान व्यक्ति, जो अपने कार्य से मान-सम्मान और पद अर्जित करता है।'
  lagna_lord_h11:
    name: लग्नेश एकादश भाव में
    text: 'लग्नेश {lagna_lord} एकादश भाव में है: लाभ, इच्छाओं की पूर्ति और मित्रों व बड़े भाई-बहनों का विस्तृत दायरा।'
  lagna_lord_h12:
    name: लग्नेश द्वादश भाव में
    text: 'लग्नेश {lagna_lord} द्वादश भाव में है: व्यय और निवेश, विदेश, एकांत और आध्यात्मिक झुकाव प्रमुख।'
